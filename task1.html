<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --green: #0F6B5F;
      --amber: #F2A93B;
      --ink: #16302B;
      --field: #F4F7F5;
      --line: #E6EFEC;
    }
    body {
      font-family: "Montserrat", sans-serif;
      color: var(--ink);
      background: var(--line);
      font-size: .9rem;
    }
    .ticket-card {
      background: #fff;
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 .75rem 2rem rgba(22, 48, 43, .15);
    }
    .ticket-head {
      background: var(--green);
      color: #fff;
      padding: 1.25rem 1.5rem;
      font-weight: 700;
      font-size: 1.35rem;
      margin: 0;
    }
    .form-label, legend.form-label { font-weight: 600; font-size: .8rem; margin-bottom: .35rem; }
    .form-control, .form-select, .input-group-text {
      background-color: var(--field);
      border: 1px solid var(--line);
      border-radius: .65rem;
      color: var(--ink);
      font-size: .85rem;
    }
    .form-floating > label { color: #6b7f7a; font-size: .8rem; }
    .form-control:focus, .form-select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .2);
    }
    .input-group-text.code {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
      font-weight: 600;
      border-radius: .65rem 0 0 .65rem;
    }
    .input-group > .form-control { border-radius: 0 .65rem .65rem 0; }
    .form-check-input:checked { background-color: var(--green); border-color: var(--green); }
    .form-check-input:focus { border-color: var(--green); box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .2); }
    .form-check-label { font-size: .8rem; }
    /* One way / Round trip */
    .trip-toggle .btn {
      border: 1px solid var(--green);
      color: var(--green);
      font-weight: 600;
      font-size: .8rem;
      background: #fff;
    }
    .trip-toggle .btn-check:checked + .btn { background: var(--green); color: #fff; }
    .trip-toggle .btn-check:focus-visible + .btn { box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .35); }
    .trip-toggle .btn:first-of-type { border-radius: 50rem 0 0 50rem; }
    .trip-toggle label.btn:last-of-type { border-radius: 0 50rem 50rem 0; }
    /* Buttons */
    .btn-find {
      background: var(--amber);
      border-color: var(--amber);
      color: #fff;
      font-weight: 700;
      border-radius: 50rem;
      padding: .55rem 1.6rem;
    }
    .btn-find:hover, .btn-find:focus-visible { background: #e09a2c; border-color: #e09a2c; color: #fff; }
    .btn-clear {
      background: #fff;
      border: 1px solid var(--ink);
      color: var(--ink);
      font-weight: 600;
      border-radius: 50rem;
      padding: .55rem 1.6rem;
    }
    .btn-clear:hover, .btn-clear:focus-visible { background: var(--ink); color: #fff; }
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">
        <div class="ticket-card">
          <h1 class="ticket-head">Book a train ticket</h1>

          <form class="p-3 p-md-4 pt-md-5" action="#" method="get">
            <div class="row g-3">

              <!-- Radio buttons styled as a button group -->
              <div class="col-12">
                <div class="btn-group trip-toggle" role="group" aria-label="Trip type">
                  <input type="radio" class="btn-check" name="trip" id="oneway" value="oneway" checked>
                  <label class="btn" for="oneway">One way</label>
                  <input type="radio" class="btn-check" name="trip" id="round" value="round">
                  <label class="btn" for="round">Round trip</label>
                </div>
              </div>

              <!-- Floating labels -->
              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="from" name="from" placeholder="From" value="Astana" required>
                  <label for="from">From</label>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="to" name="to" placeholder="To" value="Almaty" required>
                  <label for="to">To</label>
                </div>
              </div>

              <!-- Date inputs + select -->
              <div class="col-12 col-md-4">
                <label for="departure" class="form-label">Departure</label>
                <input type="date" class="form-control" id="departure" name="departure" required>
              </div>
              <div class="col-12 col-md-4">
                <label for="return" class="form-label">Return</label>
                <input type="date" class="form-control" id="return" name="return">
              </div>
              <div class="col-12 col-md-4">
                <label for="passengers" class="form-label">Passengers</label>
                <select class="form-select" id="passengers" name="passengers" required>
                  <option value="1" selected>1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </div>

              <!-- Inline radios -->
              <div class="col-12">
                <fieldset>
                  <legend class="form-label">Carriage class</legend>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="class" id="seat" value="seat" required>
                    <label class="form-check-label" for="seat">Seat</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="class" id="coupe" value="coupe" checked>
                    <label class="form-check-label" for="coupe">Coupé</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="class" id="sleeper" value="sleeper">
                    <label class="form-check-label" for="sleeper">Sleeper</label>
                  </div>
                </fieldset>
              </div>

              <!-- Input group -->
              <div class="col-12 col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <div class="input-group">
                  <span class="input-group-text code" id="phone-code">+7</span>
                  <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" aria-describedby="phone-code" autocomplete="tel-national" required>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
              </div>

              <!-- Switch + checkbox -->
              <div class="col-12">
                <div class="form-check form-switch mb-2">
                  <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
                  <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                  <label class="form-check-label" for="agree">I agree with the carriage rules</label>
                </div>
              </div>

              <!-- HTML order: Clear, Find trains. On phone column-reverse puts Find trains on top -->
              <div class="col-12">
                <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2">
                  <button type="reset" class="btn btn-clear">Clear</button>
                  <button type="submit" class="btn btn-find">Find trains</button>
                </div>
              </div>

            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
